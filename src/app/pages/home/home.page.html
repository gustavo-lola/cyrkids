<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-avatar slot="start" class="user-avatar">
      <img [src]="user.avatar" alt="Foto do usuário" />
    </ion-avatar>
    <ion-label>
      <p class="greeting-small">Bem-vinda,</p>
      <h2 class="greeting-name">Olá, {{ user.name }}!</h2>
    </ion-label>
    <ion-icon
      slot="end"
      name="notifications-outline"
      class="bell-icon"
    ></ion-icon>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="home-content">
  <section class="section">
    <h3 class="section-title">Campanhas Ativas</h3>
    <div class="campaign-carousel">
      <div
        class="campaign-card"
        *ngFor="let campaign of campaigns"
        [style.background]="campaign.bgColor"
      >
        <div class="campaign-text">
          <h4>{{ campaign.titulo }}</h4>
          <p>{{ campaign.descricao }}</p>
          <ion-button size="small" fill="solid" class="campaign-btn"
            >Saiba mais</ion-button
          >
        </div>
        <ion-icon name="medkit-outline" class="campaign-icon"></ion-icon>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <h3 class="section-title">Meus Filhos</h3>
      <button class="add-link">
        <ion-icon name="add-outline"></ion-icon> Adicionar
      </button>
    </div>

    <div
      class="crianca-card"
      *ngFor="let kid of kids"
      (click)="irParaPerfil(kid.id)"
    >
      <ion-avatar>
        <img [src]="kid.foto" [alt]="kid.nome" />
      </ion-avatar>
      <div class="crianca-info">
        <h4>{{ kid.nome }}</h4>
        <p>{{ kid.idade }}</p>
      </div>
      <ion-badge [class]="kid.statusTipo">
        <ion-icon
          [name]="kid.statusTipo === 'ok' ? 'checkmark-circle-outline' : 'alert-circle-outline'"
          class="badge-icon"
        ></ion-icon>
        {{ kid.statusLabel }}
      </ion-badge>
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <h3 class="section-title">Próximas Vacinas</h3>
      <button class="see-all-link">Ver todas</button>
    </div>

    <div class="vacina-card" *ngFor="let vaccine of vaccines">
      <div class="vacina-icon-wrapper">
        <ion-icon name="medkit-outline" class="vacina-icon"></ion-icon>
      </div>
      <div class="vacina-info">
        <h4>{{ vaccine.nome }}</h4>
        <p>{{ vaccine.criancaNome }} • {{ vaccine.doseLabel }}</p>
      </div>
      <div class="prazo-wrapper">
        <span class="prazo-destaque">{{ vaccine.prazo }}</span>
      </div>
    </div>
  </section>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="fab-add">
    <ion-fab-button>
      <ion-icon name="medkit-outline" class="vacina-button"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
